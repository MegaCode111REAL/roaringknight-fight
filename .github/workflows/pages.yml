name: Build and Deploy Roaring Knight to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout Kristal
        uses: actions/checkout@v4
        with:
          repository: KristalTeam/Kristal
          ref: a2023e571497b86f76827b44872c18723d303f99
          path: kristal

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Add the real Roaring Knight project to Kristal
        run: |
          rm -rf kristal/mods/*
          cp -a project/. kristal/mods/roaringknight_proj/
          rm -rf kristal/mods/roaringknight_proj/.git
          rm -rf kristal/mods/roaringknight_proj/.github

      - name: Configure Kristal for the real project
        run: |
          sed -i 's/^TARGET_MOD = nil$/TARGET_MOD = "roaringknight_proj"/' kristal/src/engine/vendcust.lua
          sed -i 's/^AUTO_MOD_START = false$/AUTO_MOD_START = true/' kristal/src/engine/vendcust.lua

          python3 - <<'PY'
          from pathlib import Path

          path = Path("kristal/main.lua")
          text = path.read_text()

          old_discord = 'DiscordRPC = require("src.lib.discordrpc")'
          new_discord = '''-- Browser build: Discord RPC uses LuaJIT FFI and cannot run in love.js.
          DiscordRPC = setmetatable({}, {
              __index = function()
                  return function() end
              end
          })'''

          if old_discord not in text:
              raise SystemExit("Could not find DiscordRPC require in Kristal main.lua")
          text = text.replace(old_discord, new_discord, 1)

          old_https = '''local major, _, _, _ = love.getVersion()

          if major >= 12 then
              ---@diagnostic disable-next-line: lowercase-global
              https = require("https")
              HTTPS_AVAILABLE = true
          else
              ---@diagnostic disable-next-line: lowercase-global, different-requires
              https = require("src.lib.https")
          end'''

          new_https = '''-- Browser build: native HTTPS uses LuaJIT FFI and cannot load in love.js.
          HTTPS_AVAILABLE = false
          https = {}'''

          if old_https not in text:
              raise SystemExit("Could not find Kristal HTTPS bootstrap")
          path.write_text(text.replace(old_https, new_https, 1))
          PY

      - name: Package the real Kristal engine and project
        run: |
          cd kristal
          zip -9 -r ../roaringknight.love . -x '.git/*'
          cd ..

      - name: Checkout LÖVE.js 11.5 runtime
        uses: actions/checkout@v4
        with:
          repository: Davidobot/love.js
          ref: master
          path: lovejs

      - name: Install LÖVE.js build dependencies
        working-directory: lovejs
        run: npm ci

      - name: Build the GitHub Pages site with the official LÖVE.js packager
        run: |
          set -euxo pipefail
          rm -rf site
          node lovejs/index.js -c -m 268435456 -t "Roaring Knight Fight" roaringknight.love site
          test -s site/index.html
          test -s site/game.js
          test -s site/game.data
          test -s site/love.js
          test -s site/love.wasm
          test "$(wc -c < site/game.data)" -gt 1000000
          echo "Packaged game.data size: $(wc -c < site/game.data) bytes"
          python3 - <<'PY'
          from pathlib import Path

          p = Path("site/index.html")
          s = p.read_text()

          overlay = '''<div id="runtimeError" style="display:none;position:fixed;inset:0;box-sizing:border-box;padding:16px;background:#080808;color:#ff8080;z-index:999999;overflow:auto;font:14px/1.45 monospace;white-space:pre-wrap"><b>ROARING KNIGHT — BROWSER ERROR</b>\n\n<span id="runtimeErrorText"></span></div>'''
          needle = '<div>\n<h1>{{title}}</h1>'
          if 'id="runtimeError"' not in s:
              if needle not in s:
                  raise SystemExit("love.js HTML template marker not found")
              s = s.replace(needle, needle + "\n" + overlay, 1)

          old_print = "printErr: console.error.bind(console),"
          new_print = '''printErr: (function() {
              return function(message) {
                  console.error(message);
                  var box = document.getElementById('runtimeError');
                  var text = document.getElementById('runtimeErrorText');
                  if (box && text) {
                      box.style.display = 'block';
                      text.textContent += String(message) + "\\n";
                  }
              };
          })(),'''
          if old_print not in s:
              raise SystemExit("love.js printErr hook not found")
          s = s.replace(old_print, new_print, 1)

          old_error = '''window.onerror = function(event) {
          // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
          Module.setStatus('Exception thrown, see JavaScript console');
          Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
          };
          };'''
          new_error = '''window.onerror = function(event, source, lineno, colno, error) {
              var box = document.getElementById('runtimeError');
              var text = document.getElementById('runtimeErrorText');
              if (box && text) {
                  box.style.display = 'block';
                  text.textContent += "JS ERROR: " + String(event) + "\\n";
                  if (source) text.textContent += source + ":" + lineno + ":" + colno + "\\n";
                  if (error && error.stack) text.textContent += error.stack + "\\n";
              }
              console.error(event, source, lineno, colno, error);
          };'''
          if old_error not in s:
              raise SystemExit("love.js error handler not found")
          s = s.replace(old_error, new_error, 1)

          p.write_text(s)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
