name: Build and Deploy Roaring Knight to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout Kristal
        uses: actions/checkout@v4
        with:
          repository: KristalTeam/Kristal
          ref: a2023e571497b86f76827b44872c18723d303f99
          path: kristal

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Add the real Roaring Knight project to Kristal
        run: |
          rm -rf kristal/mods/*
          cp -a project/. kristal/mods/roaringknight_proj/
          rm -rf kristal/mods/roaringknight_proj/.git
          rm -rf kristal/mods/roaringknight_proj/.github

      - name: Configure Kristal for the real project
        run: |
          sed -i 's/^TARGET_MOD = nil$/TARGET_MOD = "roaringknight_proj"/' kristal/src/engine/vendcust.lua
          sed -i 's/^AUTO_MOD_START = false$/AUTO_MOD_START = true/' kristal/src/engine/vendcust.lua

          python3 - <<'PY'
          from pathlib import Path

          path = Path("kristal/main.lua")
          text = path.read_text()

          old_discord = 'DiscordRPC = require("src.lib.discordrpc")'
          new_discord = '''local discord_rpc_ok, discord_rpc_module = pcall(require, "src.lib.discordrpc")
          if discord_rpc_ok then
              DiscordRPC = discord_rpc_module
          else
              DiscordRPC = setmetatable({}, {
                  __index = function()
                      return function() end
                  end
              })
          end'''

          if old_discord not in text:
              raise SystemExit("Could not find DiscordRPC require in Kristal main.lua")
          text = text.replace(old_discord, new_discord, 1)

          old_https = '''local major, _, _, _ = love.getVersion()

          if major >= 12 then
              ---@diagnostic disable-next-line: lowercase-global
              https = require("https")
              HTTPS_AVAILABLE = true
          else
              ---@diagnostic disable-next-line: lowercase-global, different-requires
              https = require("src.lib.https")
          end'''

          new_https = '''local major, _, _, _ = love.getVersion()

          -- love.js runs LÖVE 11.5 without LuaJIT, so native LuaJIT FFI
          -- libraries such as Kristal's desktop HTTPS module cannot load.
          -- The Roaring Knight project does not require outbound HTTPS, so
          -- disable the native backend only for the browser build.
          local is_web = false
          if love.system and love.system.getOS then
              is_web = love.system.getOS() == "Web"
          end

          if is_web then
              HTTPS_AVAILABLE = false
              https = {}
          elseif major >= 12 then
              ---@diagnostic disable-next-line: lowercase-global
              https = require("https")
              HTTPS_AVAILABLE = true
          else
              ---@diagnostic disable-next-line: lowercase-global, different-requires
              https = require("src.lib.https")
          end'''

          if old_https not in text:
              raise SystemExit("Could not find Kristal HTTPS bootstrap")
          path.write_text(text.replace(old_https, new_https, 1))
          PY

      - name: Package the real Kristal engine and project
        run: |
          cd kristal
          zip -9 -r ../roaringknight.love . -x '.git/*'
          cd ..

      - name: Checkout LÖVE.js 11.5 runtime
        uses: actions/checkout@v4
        with:
          repository: Davidobot/love.js
          ref: master
          path: lovejs

      - name: Build the GitHub Pages site with the real Kristal game
        run: |
          set -euxo pipefail
          rm -rf site
          mkdir -p site
          cp lovejs/src/compat/love.js site/love.js
          cp lovejs/src/compat/love.wasm site/love.wasm
          cp -a lovejs/src/compat/theme site/theme

          python3 - <<'PY'
          import json
          import uuid
          from pathlib import Path

          game_path = Path("roaringknight.love")
          size = game_path.stat().st_size

          metadata = {
              "package_uuid": str(uuid.uuid4()),
              "remote_package_size": size,
              "files": [{
                  "filename": "/game.love",
                  "crunched": 0,
                  "start": 0,
                  "end": size,
                  "audio": False,
              }],
          }

          template = Path("lovejs/src/game.js").read_text()

          # GitHub Pages can handle arbitrary static files, but using a
          # conventional binary extension avoids any server/content-type
          # handling differences for Emscripten's data package.
          template = template.replace("game.data", "game.bin")

          game_js = template.replace("{{{create_file_paths}}}", "")
          game_js = game_js.replace(
              "{{{metadata}}}",
              json.dumps(metadata, separators=(",", ":"))
          )
          Path("site/game.js").write_text(game_js)

          index = Path("lovejs/src/compat/index.html").read_text()
          index = index.replace("{{title}}", "Roaring Knight Fight")
          index = index.replace("{{{arguments}}}", json.dumps(["./game.love"]))
          index = index.replace("{{memory}}", "67108864")
          Path("site/index.html").write_text(index)

          game_path.replace("site/game.bin")
          PY

          test -s site/index.html
          test -s site/game.js
          test -s site/game.bin
          test -s site/love.js
          test -s site/love.wasm
          test "$(wc -c < site/game.bin)" -gt 1000000
          grep -q "REMOTE_PACKAGE_BASE = 'game.bin'" site/game.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
